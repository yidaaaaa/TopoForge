[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "topoforge"
version = "0.8.1"
description = "Reproducible, provenance-aware terrain models for additive manufacturing"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "DATA_LICENSES.md", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12,<3.13"
authors = [{ name = "TopoForge contributors" }]
keywords = ["3d-printing", "dem", "gis", "terrain"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "fastapi>=0.116,<1",
  "lib3mf==2.5.0",
  "numpy>=2.1,<2.5",
  "pillow>=11,<12",
  "pydantic>=2.10,<3",
  "pyproj>=3.7,<4",
  "pyyaml>=6.0.2,<7",
  "rasterio>=1.4,<2",
  "scipy>=1.14,<2",
  "shapely>=2.0,<3",
  "trimesh[easy]>=4.6,<5",
  "typer>=0.15,<1",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "hypothesis>=6.125,<7",
  "httpx2>=2,<3",
  "pyright>=1.1.395,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
topoforge = "topoforge.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/topoforge"]

[tool.hatch.build.targets.sdist]
include = [
  "/.github",
  "/benchmarks",
  "/docs",
  "/examples",
  "/printer_profiles",
  "/reference_regions",
  "/scripts",
  "/src",
  "/tests",
  "/web",
  "/CITATION.cff",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/DATA_LICENSES.md",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/THIRD_PARTY_NOTICES.md",
  "/pyproject.toml",
  "/uv.lock",
]
exclude = [
  "**/__pycache__",
  "**/*.pyc",
  "/web/node_modules",
  "/web/playwright-report",
  "/web/test-results",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: uses external tools or network",
  "slicer: invokes a real slicer executable",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src"]
reportMissingTypeStubs = false
exclude = ["outputs", "artifacts"]

[tool.coverage.run]
source = ["topoforge"]
branch = true
