name: macos-native-arm64-unverified

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-native-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-arm64:
    name: ${{ matrix.target }} native CI (support unverified)
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macOS Sequoia 15 arm64
            runner: macos-15
          - target: macOS Tahoe 26 arm64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Record native runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          sw_vers
          uname -a
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          architecture: arm64
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.8.24"
          enable-cache: true
      - name: Install the locked development environment
        run: uv sync --locked --all-groups
      - name: Verify the frozen support contract
        run: uv run python scripts/verify_macos_support_matrix.py
      - name: Record bounded native runtime evidence
        run: >-
          uv run python scripts/collect_macos_ci_evidence.py
          --runner-label "${{ matrix.runner }}"
          --report "artifacts/logs/macos-${{ matrix.runner }}-runtime.json"
      - name: Exercise native imports and diagnostics
        run: uv run topoforge doctor
      - name: Build, reopen, and compare deterministic artifacts
        shell: bash
        run: |
          set -euo pipefail
          evidence_root="$RUNNER_TEMP/TopoForge Phase 13/地形"
          dem="$evidence_root/输入/高程.tif"
          primary="$evidence_root/构建 primary"
          repeat="$evidence_root/构建 repeat"

          uv run topoforge synthetic \
            --output "$dem" \
            --terrain gaussian-hill \
            --rows 32 \
            --columns 40 \
            --pixel-size-m 20
          for output in "$primary" "$repeat"; do
            uv run topoforge build \
              --dem "$dem" \
              --output "$output" \
              --size-mm 40 32 \
              --base-mm 2 \
              --max-height-mm 20 \
              --vertical-scale fit-height \
              --sampling-mode source-preserving \
              --max-grid-cells 10000 \
              --max-estimated-triangles 50000 \
              --resource-budget-mode strict \
              --dataset-type dtm
            uv run topoforge preview "$output"
            uv run topoforge inspect "$output/model.3mf"
            uv run topoforge validate "$output/model.stl"
          done

          cmp "$primary/model.stl" "$repeat/model.stl"
          cmp "$primary/model.3mf" "$repeat/model.3mf"
          cmp "$primary/preview.glb" "$repeat/preview.glb"
      - name: Check source-tree local Web assets and explicit input boundary
        run: uv run topoforge web --check --no-open --input-root "$GITHUB_WORKSPACE"
      - name: Probe app-bundle working directory without an input-root override
        shell: bash
        run: |
          set -euo pipefail
          probe_home="$RUNNER_TEMP/TopoForge App Probe/用户"
          app_working_directory="$RUNNER_TEMP/TopoForge.app/Contents/MacOS"
          report="$RUNNER_TEMP/topoforge-app-defaults.json"
          mkdir -p "$probe_home" "$app_working_directory"
          (
            cd "$app_working_directory"
            HOME="$probe_home" CFFIXED_USER_HOME="$probe_home" \
              "$GITHUB_WORKSPACE/.venv/bin/topoforge" web --check --no-open > "$report"
          )
          uv run python -c \
            'import json, pathlib, sys; report=json.loads(pathlib.Path(sys.argv[1]).read_text()); expected=str(pathlib.Path(sys.argv[2]).resolve()); assert report["input_roots"] == [expected], report' \
            "$report" "$probe_home"
      - name: Run Ruff lint gate
        run: uv run ruff check .
      - name: Run Ruff format gate
        run: uv run ruff format --check .
      - name: Run Pyright gate
        run: uv run pyright
      - id: release-pytest
        name: Run release regression suite
        env:
          PYTEST_ADDOPTS: >-
            --junitxml=artifacts/logs/macos-${{ matrix.runner }}-release-pytest.xml
            --tb=short
        run: uv run pytest tests/release
      - name: Report release regression failure
        if: failure() && steps.release-pytest.outcome == 'failure'
        run: >-
          uv run python scripts/report_pytest_failure.py
          --junit artifacts/logs/macos-${{ matrix.runner }}-release-pytest.xml
          --title "${{ matrix.target }} release pytest"
      - id: slicer-pytest
        name: Run slicer regression suite
        env:
          PYTEST_ADDOPTS: >-
            --junitxml=artifacts/logs/macos-${{ matrix.runner }}-slicer-pytest.xml
            --tb=short
        run: uv run pytest tests/slicer
      - name: Report slicer regression failure
        if: failure() && steps.slicer-pytest.outcome == 'failure'
        run: >-
          uv run python scripts/report_pytest_failure.py
          --junit artifacts/logs/macos-${{ matrix.runner }}-slicer-pytest.xml
          --title "${{ matrix.target }} slicer pytest"
      - name: Run unit regression suite
        run: uv run pytest tests/unit
      - name: Run Web API regression suite
        run: uv run pytest tests/web/test_api.py
      - name: Run recovered Web job cancellation regression
        run: >-
          uv run pytest tests/web/test_jobs.py::test_running_job_recovers_and_cancels_after_manager_restart
      - name: Run remaining Web job regressions
        run: >-
          uv run pytest tests/web/test_jobs.py -k "not running_job_recovers_and_cancels_after_manager_restart"
      - name: Run Web map tile regression suite
        run: uv run pytest tests/web/test_map_tiles.py
      - id: web-process-pytest
        name: Run Web process regression suite
        env:
          PYTEST_ADDOPTS: >-
            --junitxml=artifacts/logs/macos-${{ matrix.runner }}-web-process-pytest.xml
            --tb=short
        run: uv run pytest tests/web/test_processes.py
      - name: Report Web process regression failure
        if: failure() && steps.web-process-pytest.outcome == 'failure'
        run: >-
          uv run python scripts/report_pytest_failure.py
          --junit artifacts/logs/macos-${{ matrix.runner }}-web-process-pytest.xml
          --title "${{ matrix.target }} Web process pytest"
      - name: Run CLI, geometry, and property regression suite
        run: uv run pytest tests/cli tests/geometry tests/property
      - name: Run provider regression suite
        run: uv run pytest tests/providers
      - name: Run integration regression suite
        run: uv run pytest tests/integration
      - name: Retain temporary source-tree runtime diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.runner }}-runtime-evidence
          path: |
            artifacts/logs/macos-${{ matrix.runner }}-runtime.json
            artifacts/logs/macos-${{ matrix.runner }}-runtime.json.sha256
            artifacts/logs/macos-${{ matrix.runner }}-release-pytest.xml
            artifacts/logs/macos-${{ matrix.runner }}-slicer-pytest.xml
            artifacts/logs/macos-${{ matrix.runner }}-web-process-pytest.xml
          if-no-files-found: warn
          retention-days: 30
  package-arm64:
    name: Build one deterministic unsigned arm64 hosted-package candidate
    needs: native-arm64
    runs-on: macos-15
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      PYTHONHASHSEED: "0"
    outputs:
      source_commit: ${{ steps.candidate.outputs.source_commit }}
      archive_filename: ${{ steps.candidate.outputs.archive_filename }}
      archive_sha256: ${{ steps.candidate.outputs.archive_sha256 }}
      app_payload_sha256: ${{ steps.candidate.outputs.app_payload_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          architecture: arm64
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.8.24"
          enable-cache: true
      - name: Install locked build and verification environment
        run: uv sync --locked --all-groups
      - name: Build production Web assets
        working-directory: web
        run: |
          npm ci
          npm run build
      - id: package-version
        name: Resolve unchanged project version
        run: echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"
      - id: primary-build
        name: Build primary unsigned app candidate
        run: >-
          uv run --python 3.12 python scripts/build_macos_app.py
          --output-dir dist/macos-primary
          --cache-dir "$RUNNER_TEMP/topoforge-cpython-runtime"
          --version "${{ steps.package-version.outputs.version }}"
          --report artifacts/logs/ci-macos-app-primary-build.json
      - name: Report primary candidate build failure
        if: failure() && steps.primary-build.outcome == 'failure'
        run: >-
          uv run --python 3.12 python scripts/report_json_failure.py
          --report artifacts/logs/ci-macos-app-primary-build.json
          --title "macOS primary app candidate build"
      - name: Build repeat unsigned app candidate
        run: >-
          uv run --python 3.12 python scripts/build_macos_app.py
          --output-dir dist/macos-repeat
          --cache-dir "$RUNNER_TEMP/topoforge-cpython-runtime"
          --version "${{ steps.package-version.outputs.version }}"
          --report artifacts/logs/ci-macos-app-repeat-build.json
      - id: archive-verification
        name: Verify archive closure and repeat-build determinism
        run: >-
          uv run --python 3.12 python scripts/verify_macos_app.py
          --archive
          "dist/macos-primary/topoforge-${{ steps.package-version.outputs.version }}-macos-arm64-unsigned-candidate.zip"
          --repeat-archive
          "dist/macos-repeat/topoforge-${{ steps.package-version.outputs.version }}-macos-arm64-unsigned-candidate.zip"
          --expected-source-commit "$GITHUB_SHA"
          --report artifacts/logs/ci-macos-app-archive-verification.json
      - id: candidate
        name: Bind source, archive, and app payload outputs
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/macos-primary/topoforge-${{ steps.package-version.outputs.version }}-macos-arm64-unsigned-candidate.zip"
          repeat="dist/macos-repeat/topoforge-${{ steps.package-version.outputs.version }}-macos-arm64-unsigned-candidate.zip"
          report="artifacts/logs/ci-macos-app-archive-verification.json"
          cmp "$archive" "$repeat"
          archive_sha256="$(shasum -a 256 "$archive" | awk '{print $1}')"
          report_sha256="$(uv run --python 3.12 python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["archive"]["sha256"])' "$report")"
          source_commit="$(uv run --python 3.12 python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["source"]["commit"])' "$report")"
          payload_sha256="$(uv run --python 3.12 python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["contents"]["payload_sha256"])' "$report")"
          test "$archive_sha256" = "$report_sha256"
          test "$source_commit" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          printf '%s  %s\n' "$archive_sha256" "$(basename "$archive")" > dist/macos-primary/SHA256SUMS
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "archive_filename=$(basename "$archive")" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$archive_sha256" >> "$GITHUB_OUTPUT"
          echo "app_payload_sha256=$payload_sha256" >> "$GITHUB_OUTPUT"
          echo "::notice title=Unsigned macOS hosted-package candidate SHA-256::$archive_sha256"
      - name: Enforce candidate artifact bounds and detached hashes
        shell: bash
        run: |
          set -euo pipefail
          uv run --python 3.12 python - <<'PY'
          import hashlib
          from pathlib import Path

          files = [
              Path("dist/macos-primary") / "${{ steps.candidate.outputs.archive_filename }}",
              Path("dist/macos-primary") / (
                  "${{ steps.candidate.outputs.archive_filename }}.sha256"
              ),
              Path("dist/macos-primary/SHA256SUMS"),
              Path("artifacts/logs/ci-macos-app-primary-build.json"),
              Path("artifacts/logs/ci-macos-app-primary-build.json.sha256"),
              Path("artifacts/logs/ci-macos-app-repeat-build.json"),
              Path("artifacts/logs/ci-macos-app-repeat-build.json.sha256"),
              Path("artifacts/logs/ci-macos-app-archive-verification.json"),
              Path("artifacts/logs/ci-macos-app-archive-verification.json.sha256"),
          ]
          for path in files:
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"candidate artifact member is missing or unsafe: {path}")
          if files[0].stat().st_size > 805_306_368:
              raise SystemExit("candidate archive exceeds its upload bound")
          for report in files[3:]:
              if report.suffix == ".json" and report.stat().st_size > 16_777_216:
                  raise SystemExit(f"candidate report exceeds its upload bound: {report}")
              if report.suffix != ".json":
                  continue
              expected, name = report.with_name(f"{report.name}.sha256").read_text().split()
              if name != report.name:
                  raise SystemExit(f"candidate report sidecar name changed: {report}")
              observed = hashlib.sha256(report.read_bytes()).hexdigest()
              if observed != expected:
                  raise SystemExit(f"candidate report sidecar digest changed: {report}")
          PY
      - name: Retain unsigned hosted-package candidate and bounded evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: topoforge-macos-arm64-unsigned-hosted-package-candidate
          path: |
            dist/macos-primary/*.zip
            dist/macos-primary/*.zip.sha256
            dist/macos-primary/SHA256SUMS
            artifacts/logs/ci-macos-app-primary-build.json
            artifacts/logs/ci-macos-app-primary-build.json.sha256
            artifacts/logs/ci-macos-app-repeat-build.json
            artifacts/logs/ci-macos-app-repeat-build.json.sha256
            artifacts/logs/ci-macos-app-archive-verification.json
            artifacts/logs/ci-macos-app-archive-verification.json.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Retain package failure diagnostics only
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: topoforge-macos-arm64-package-failed-diagnostics-${{ github.run_attempt }}
          path: |
            artifacts/logs/ci-macos-app-primary-build.json
            artifacts/logs/ci-macos-app-primary-build.json.sha256
            artifacts/logs/ci-macos-app-repeat-build.json
            artifacts/logs/ci-macos-app-repeat-build.json.sha256
            artifacts/logs/ci-macos-app-archive-verification.json
            artifacts/logs/ci-macos-app-archive-verification.json.sha256
          if-no-files-found: warn
          retention-days: 14

  packaged-app-acceptance:
    name: ${{ matrix.target_id }} same-candidate hosted-package acceptance
    needs: package-arm64
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_id: macos-15-arm64
            runner: macos-15
          - target_id: macos-26-arm64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      EXPECTED_SOURCE_COMMIT: ${{ needs.package-arm64.outputs.source_commit }}
      EXPECTED_ARCHIVE_FILENAME: ${{ needs.package-arm64.outputs.archive_filename }}
      EXPECTED_ARCHIVE_SHA256: ${{ needs.package-arm64.outputs.archive_sha256 }}
      EXPECTED_APP_PAYLOAD_SHA256: ${{ needs.package-arm64.outputs.app_payload_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          architecture: arm64
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.8.24"
          enable-cache: true
      - name: Install locked acceptance environment
        run: uv sync --locked --all-groups
      - name: Download the one source-bound candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: topoforge-macos-arm64-unsigned-hosted-package-candidate
          path: downloaded/macos-candidate
      - name: Verify downloaded candidate source and archive binding
        shell: bash
        run: |
          set -euo pipefail
          archive="downloaded/macos-candidate/dist/macos-primary/$EXPECTED_ARCHIVE_FILENAME"
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE_COMMIT"
          test -f "$archive"
          test ! -L "$archive"
          observed="$(shasum -a 256 "$archive" | awk '{print $1}')"
          test "$observed" = "$EXPECTED_ARCHIVE_SHA256"
          test "$(find downloaded/macos-candidate -type f | wc -l | tr -d ' ')" -le 9
          test "$(find downloaded/macos-candidate -type l | wc -l | tr -d ' ')" = 0
      - id: packaged-system
        name: Execute native packaged Web, recovery, and manufacturing acceptance
        shell: bash
        run: |
          set -euo pipefail
          archive="downloaded/macos-candidate/dist/macos-primary/$EXPECTED_ARCHIVE_FILENAME"
          work_root="$RUNNER_TEMP/TopoForge Phase 13A ${{ matrix.target_id }}/验收-${GITHUB_RUN_ATTEMPT}"
          uv run --python 3.12 python scripts/verify_macos_system.py \
            --archive "$archive" \
            --expected-source-commit "$EXPECTED_SOURCE_COMMIT" \
            --expected-target "${{ matrix.target_id }}" \
            --evidence-scope hosted-package \
            --work-root "$work_root" \
            --report "artifacts/logs/${{ matrix.target_id }}-hosted-package.json"
      - name: Report packaged acceptance failure
        if: failure() && steps.packaged-system.outcome == 'failure'
        shell: bash
        run: |
          uv run --python 3.12 python scripts/report_json_failure.py \
            --report "artifacts/logs/${{ matrix.target_id }}-hosted-package.json" \
            --title "${{ matrix.target_id }} packaged acceptance"
      - name: Verify acceptance payload and report bounds
        shell: bash
        run: |
          set -euo pipefail
          report="artifacts/logs/${{ matrix.target_id }}-hosted-package.json"
          uv run --python 3.12 python - "$report" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          if path.stat().st_size > 16_777_216:
              raise SystemExit("hosted-package evidence exceeds its upload bound")
          report = json.loads(path.read_text(encoding="utf-8"))
          if report["evidence_scope"] != "hosted-package":
              raise SystemExit("hosted runner attempted a non-hosted evidence scope")
          if report["source"]["commit"] != "${{ needs.package-arm64.outputs.source_commit }}":
              raise SystemExit("hosted-package report source binding changed")
          if report["archive"]["sha256"] != "${{ needs.package-arm64.outputs.archive_sha256 }}":
              raise SystemExit("hosted-package report archive binding changed")
          if report["app_payload_sha256"] != "${{ needs.package-arm64.outputs.app_payload_sha256 }}":
              raise SystemExit("hosted-package report app payload binding changed")
          digest, name = path.with_name(f"{path.name}.sha256").read_text().split()
          if name != path.name or digest != hashlib.sha256(path.read_bytes()).hexdigest():
              raise SystemExit("hosted-package report detached SHA-256 changed")
          PY
      - name: Retain bounded hosted-package acceptance evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: topoforge-${{ matrix.target_id }}-hosted-package-evidence
          path: |
            artifacts/logs/${{ matrix.target_id }}-hosted-package.json
            artifacts/logs/${{ matrix.target_id }}-hosted-package.json.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Retain acceptance failure diagnostics only
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: topoforge-${{ matrix.target_id }}-acceptance-failed-diagnostics-${{ github.run_attempt }}
          path: |
            artifacts/logs/${{ matrix.target_id }}-hosted-package.json
            artifacts/logs/${{ matrix.target_id }}-hosted-package.json.sha256
          if-no-files-found: warn
          retention-days: 14
