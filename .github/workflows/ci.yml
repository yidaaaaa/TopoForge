name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.8.24"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: npm ci
        working-directory: web
      - run: uv run python scripts/verify_public_tree.py
      - run: npm run build
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run test
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:ui
        working-directory: web
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - name: Run canonical Linux x86_64 Python 3.12 core acceptance
        run: >-
          uv run python scripts/verify_platform_core.py
          --report artifacts/logs/ci-linux-x86_64-python-3.12-core.json
      - run: uv run pytest
      - name: Retain canonical Linux x86_64 Python 3.12 core evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: topoforge-linux-x86_64-python-3.12-core-evidence
          path: artifacts/logs/ci-linux-x86_64-python-3.12-core.json
          if-no-files-found: error
          retention-days: 14

  python-compatibility:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.8.24"
          enable-cache: true
      - name: Verify universal locked dependency graph
        run: uv lock --check
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Verify public source boundary
        run: uv run python scripts/verify_public_tree.py
      - name: Run deterministic core and Web acceptance
        run: >-
          uv run python scripts/verify_platform_core.py
          --report artifacts/logs/ci-python-${{ matrix.python-version }}.json
      - id: python-pytest
        name: Run Python regression suite
        env:
          PYTEST_ADDOPTS: >-
            --junitxml=artifacts/logs/ci-python-${{ matrix.python-version }}-pytest.xml
            --tb=short
        run: uv run pytest
      - name: Report Python regression failure
        if: failure() && steps.python-pytest.outcome == 'failure'
        run: >-
          uv run python scripts/report_pytest_failure.py
          --junit artifacts/logs/ci-python-${{ matrix.python-version }}-pytest.xml
          --title "Python ${{ matrix.python-version }} pytest"
      - name: Retain compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: topoforge-python-${{ matrix.python-version }}-evidence
          path: |
            artifacts/logs/ci-python-${{ matrix.python-version }}.json
            artifacts/logs/ci-python-${{ matrix.python-version }}-pytest.xml
          if-no-files-found: error

  windows-core:
    name: Windows x64 core
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          architecture: x64
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.8.24"
          enable-cache: true
      - name: Verify locked dependency graph
        run: uv lock --check
      - name: Install locked core and test dependencies
        run: uv sync --locked --all-groups
      - name: Verify public source boundary
        run: uv run python scripts/verify_public_tree.py
      - name: Run Windows x64 core acceptance
        env:
          TOPOFORGE_CI_TRACEBACK: "1"
        run: >-
          uv run python scripts/verify_platform_core.py
          --report artifacts/logs/ci-windows-x64-core.json
      - name: Report Windows core acceptance failure
        if: failure()
        shell: pwsh
        run: |
          $reportPath = "artifacts/logs/ci-windows-x64-core.json"
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
            Write-Output "::error title=Windows core acceptance::failure report was not produced"
            exit 0
          }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if ($null -eq $report.error) {
            Write-Output "::error title=Windows core acceptance::failure report has no error details"
            exit 0
          }
          $message = "{0}: {1}" -f $report.error.type, $report.error.message
          if ($message.Length -gt 12000) {
            $message = $message.Substring($message.Length - 12000)
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### Windows core acceptance"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '```text'
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $message
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '```'
          $message = $message.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
          Write-Output "::error title=Windows core acceptance::$message"
      - id: windows-system
        name: Run Windows Web lifecycle and recovery acceptance
        env:
          TOPOFORGE_CI_TRACEBACK: "1"
        run: >-
          uv run python scripts/verify_windows_system.py
          --require-windows
          --hosted-server
          --browser-mode skip
          --report artifacts/logs/ci-windows-x64-system.json
      - name: Report Windows system acceptance failure
        if: failure() && steps.windows-system.outcome == 'failure'
        shell: pwsh
        run: |
          $reportPath = "artifacts/logs/ci-windows-x64-system.json"
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
            Write-Output "::error title=Windows system acceptance::failure report was not produced"
            exit 0
          }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if ($null -eq $report.error) {
            Write-Output "::error title=Windows system acceptance::failure report has no error details"
            exit 0
          }
          $message = "{0}: {1}" -f $report.error.type, $report.error.message
          if ($message.Length -gt 3800) {
            $tail = $message.Substring($message.Length - 3600)
            $message = "{0}: [tail of bounded failure detail]`n{1}" -f $report.error.type, $tail
          }
          $message = $message.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
          Write-Output "::error title=Windows system acceptance::$message"
      - id: windows-pytest
        name: Run Python regression suite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "artifacts/logs" | Out-Null
          uv run pytest -q --tb=short 2>&1 |
            Tee-Object -FilePath "artifacts/logs/ci-windows-x64-pytest.log"
          exit $LASTEXITCODE
      - name: Report Windows Python regression failure
        if: failure() && steps.windows-pytest.outcome == 'failure'
        shell: pwsh
        run: |
          $logPath = "artifacts/logs/ci-windows-x64-pytest.log"
          if (-not (Test-Path -LiteralPath $logPath -PathType Leaf)) {
            Write-Output "::error title=Windows pytest::failure log was not produced"
            exit 0
          }
          $message = (Get-Content -LiteralPath $logPath -Tail 160) -join "`n"
          $message = $message.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
          Write-Output "::error title=Windows pytest::$message"
      - name: Retain Windows core evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: topoforge-windows-x64-core-evidence
          path: |
            artifacts/logs/ci-windows-x64-core.json
            artifacts/logs/ci-windows-x64-system.json
            artifacts/logs/ci-windows-x64-pytest.log
          if-no-files-found: error

  windows-bambu-contracts:
    name: Windows x64 Bambu contracts (no official binary)
    needs: windows-core
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          architecture: x64
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.8.24"
          enable-cache: true
      - name: Install locked core and test dependencies
        run: uv sync --locked --all-groups
      - name: Run Windows Bambu discovery and acceptance contracts
        run: >-
          uv run pytest -q
          tests/slicer/test_bambu_windows.py
          tests/unit/test_bambu_profiles.py
          tests/cli/test_windows_bambu.py
          tests/release/test_windows_bambu_acceptance.py
      - name: Verify native Bambu acceptance command surface
        run: uv run python scripts/verify_windows_bambu.py --help

  windows-installed-release:
    name: Windows x64 installed release
    needs: windows-core
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          architecture: x64
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.8.24"
          enable-cache: true
      - name: Verify locked dependency graph
        run: uv lock --check
      - name: Install locked build and test dependencies
        run: uv sync --locked --all-groups
      - id: package-version
        name: Resolve project version
        shell: pwsh
        run: |
          "version=$(uv version --short)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Build Windows-hosted release archives
        run: uv build --no-sources --build-constraints packaging/build-constraints.txt --require-hashes --out-dir dist/windows-release
      - name: Verify a fresh Windows virtual-environment installation
        run: >-
          uv run python scripts/verify_release.py
          --primary-dir dist/windows-release
          --version ${{ steps.package-version.outputs.version }}
          --install
          --report artifacts/logs/ci-windows-x64-installed-release.json
      - name: Retain installed-release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: topoforge-windows-x64-installed-release-evidence
          path: |
            dist/windows-release/*
            artifacts/logs/ci-windows-x64-installed-release.json
          if-no-files-found: error
          retention-days: 14

  windows-portable:
    name: Windows x64 portable candidate
    needs: windows-core
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      SOURCE_DATE_EPOCH: "1580601600"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          architecture: x64
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.8.24"
          enable-cache: true
      - name: Install locked build and test dependencies
        run: uv sync --locked --all-groups
      - name: Build packaged Web application
        working-directory: web
        run: |
          npm ci
          npm run build
      - id: package-version
        name: Resolve project version
        shell: pwsh
        run: |
          "version=$(uv version --short)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Build primary Windows x64 portable candidate
        run: >-
          uv run python scripts/build_windows_portable.py
          --output-dir dist/windows-primary
          --version ${{ steps.package-version.outputs.version }}
          --report artifacts/logs/ci-windows-portable-primary-build.json
      - name: Build repeat Windows x64 portable candidate
        run: >-
          uv run python scripts/build_windows_portable.py
          --output-dir dist/windows-repeat
          --version ${{ steps.package-version.outputs.version }}
          --report artifacts/logs/ci-windows-portable-repeat-build.json
      - id: windows-portable-verification
        name: Verify reproducibility and execute the portable candidate
        run: >-
          uv run python scripts/verify_windows_portable.py
          --archive
          dist/windows-primary/topoforge-${{ steps.package-version.outputs.version }}-windows-x64-portable.zip
          --repeat-archive
          dist/windows-repeat/topoforge-${{ steps.package-version.outputs.version }}-windows-x64-portable.zip
          --expected-version ${{ steps.package-version.outputs.version }}
          --execute
          --hosted-server
          --browser-mode skip
          --work-root artifacts/windows-portable-acceptance
          --report artifacts/logs/ci-windows-portable-verification.json
      - name: Report Windows portable verification failure
        if: failure() && steps.windows-portable-verification.outcome == 'failure'
        shell: pwsh
        run: |
          $reportPath = "artifacts/logs/ci-windows-portable-verification.json"
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
            Write-Output "::error title=Windows portable verification::failure report was not produced"
            exit 0
          }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if ($null -eq $report.error) {
            Write-Output "::error title=Windows portable verification::failure report has no error details"
            exit 0
          }
          $message = "{0}: {1}" -f $report.error.type, $report.error.message
          $message = $message.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
          Write-Output "::error title=Windows portable verification::$message"
      - name: Publish Windows portable candidate checksum
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -LiteralPath "dist/windows-primary" -Filter "*.zip" -File)
          if ($archives.Count -ne 1) {
            throw "expected exactly one primary Windows portable archive"
          }
          $archive = $archives[0]
          $digest = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $report = Get-Content -LiteralPath "artifacts/logs/ci-windows-portable-verification.json" -Raw | ConvertFrom-Json
          if (-not $report.required_checks_passed -or
              $digest -ne $report.archive.sha256 -or
              $digest -ne $report.reproducibility.primary_sha256 -or
              $digest -ne $report.reproducibility.repeat_sha256) {
            throw "portable candidate checksum differs from verified reproducible archives"
          }
          $line = "$digest  $($archive.Name)"
          $line | Set-Content -LiteralPath "dist/windows-primary/SHA256SUMS" -Encoding ascii
          Write-Output "::notice title=Windows portable SHA-256::$line"
      - name: Retain verified Windows portable candidate and evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: topoforge-windows-x64-portable-candidate
          path: |
            dist/windows-primary/*.zip
            dist/windows-primary/SHA256SUMS
            artifacts/logs/ci-windows-portable-primary-build.json
            artifacts/logs/ci-windows-portable-repeat-build.json
            artifacts/logs/ci-windows-portable-verification.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain failed Windows portable diagnostics only
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: topoforge-windows-x64-portable-failed-diagnostics-${{ github.run_attempt }}
          path: |
            artifacts/logs/ci-windows-portable-primary-build.json
            artifacts/logs/ci-windows-portable-repeat-build.json
            artifacts/logs/ci-windows-portable-verification.json
          if-no-files-found: warn
          retention-days: 14

  release:
    needs: quality
    runs-on: ubuntu-22.04
    env:
      SOURCE_DATE_EPOCH: "1580601600"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.8.24"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - id: package-version
        run: echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"
      - run: uv build --no-sources --build-constraints packaging/build-constraints.txt --require-hashes --out-dir dist/primary
      - run: uv build --no-sources --build-constraints packaging/build-constraints.txt --require-hashes --out-dir dist/repeat
      - run: >-
          uv run python scripts/verify_release.py
          --primary-dir dist/primary
          --repeat-dir dist/repeat
          --version ${{ steps.package-version.outputs.version }}
          --install
          --report artifacts/logs/ci-release-verification.json
      - run: >-
          uv run python scripts/verify_reference_regions.py
          --catalog reference_regions/catalog.yaml
          --definitions-only
          --report artifacts/logs/ci-reference-regions.json
      - run: >-
          uv run python scripts/run_benchmarks.py
          --baseline benchmarks/baseline.json
          --repeat 2
          --report artifacts/logs/ci-benchmarks.json
