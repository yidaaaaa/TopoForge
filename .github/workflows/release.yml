name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate and stage release candidate
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    outputs:
      publish: ${{ steps.target.outputs.publish }}
      tag: ${{ steps.target.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      source_commit: ${{ steps.version.outputs.source_commit }}
      wheel_filename: ${{ steps.archives.outputs.wheel_filename }}
      wheel_sha256: ${{ steps.archives.outputs.wheel_sha256 }}
      sdist_filename: ${{ steps.archives.outputs.sdist_filename }}
      sdist_sha256: ${{ steps.archives.outputs.sdist_sha256 }}
      windows_required: ${{ steps.windows-evidence.outputs.required }}
      portable_filename: ${{ steps.windows-evidence.outputs.archive_filename }}
      portable_sha256: ${{ steps.windows-evidence.outputs.archive_sha256 }}
      checksums_sha256: ${{ steps.release-assets.outputs.checksums_sha256 }}
    env:
      SOURCE_DATE_EPOCH: "1580601600"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - id: target
        name: Select unpublished release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_contract_supported() {
            local candidate="$1"
            local commit="refs/tags/${candidate}^{commit}"
            local required_path
            for required_path in \
              scripts/verify_release.py \
              scripts/verify_release_evidence.py \
              scripts/verify_release_rollback.py \
              packaging/build-constraints.txt \
              packaging/release-evidence.schema.json; do
              git cat-file -e "${commit}:${required_path}" 2>/dev/null || return 1
            done
            git grep -Fq -e "--github-output" "$commit" -- \
              scripts/verify_release.py || return 1
            git grep -Fq -e "--metadata-only" "$commit" -- \
              scripts/verify_release_evidence.py || return 1
            git grep -Fq -e "--github-output" "$commit" -- \
              scripts/verify_release_evidence.py || return 1
            git grep -Fq -e "--extract-artifact" "$commit" -- \
              scripts/verify_release_evidence.py || return 1
          }
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            if ! release_contract_supported "$tag"; then
              echo "::error::Release tag ${tag} predates the Phase 12 release contract and cannot be published by this workflow." >&2
              exit 1
            fi
          else
            current_tag="v$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
            tag=""
            while IFS= read -r candidate; do
              if [[ "$candidate" == "$current_tag" ]]; then
                continue
              fi
              if ! release_contract_supported "$candidate"; then
                echo "Skipping ${candidate}: Phase 12 release contract is unavailable." >&2
                continue
              fi
              if gh release view "$candidate" >/dev/null 2>&1; then
                continue
              fi
              tag="$candidate"
              break
            done < <(git tag --merged HEAD --list 'v*' --sort=-v:refname)
          fi
          if [[ -z "$tag" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git rev-parse --verify "refs/tags/$tag^{commit}" >/dev/null
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Skip when every reachable tag is published
        if: steps.target.outputs.publish != 'true'
        run: echo "No unpublished release tag is reachable from this revision."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.target.outputs.publish == 'true'
        with:
          ref: ${{ steps.target.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.target.outputs.publish == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        if: steps.target.outputs.publish == 'true'
        with:
          version: "0.8.24"
          enable-cache: true
      - id: version
        name: Verify tag and package version
        if: steps.target.outputs.publish == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          test "v$version" = "$RELEASE_TAG"
          source_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse "HEAD^{commit}")" = "$source_commit"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
      - id: windows-evidence
        name: Verify tracked Windows release evidence metadata
        if: steps.target.outputs.publish == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/logs
          env -u GH_TOKEN python scripts/verify_release_evidence.py \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --metadata-only \
            --github-output "$GITHUB_OUTPUT" \
            --report artifacts/logs/github-windows-release-evidence-metadata.json
      - name: Verify Windows candidate workflow identity
        if: >-
          steps.target.outputs.publish == 'true' &&
          steps.windows-evidence.outputs.required == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN_ID: ${{ steps.windows-evidence.outputs.run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ steps.windows-evidence.outputs.run_attempt }}
          EVIDENCE_WORKFLOW_ID: ${{ steps.windows-evidence.outputs.workflow_id }}
          EVIDENCE_WORKFLOW_PATH: ${{ steps.windows-evidence.outputs.workflow_path }}
          EVIDENCE_WORKFLOW_EVENT: ${{ steps.windows-evidence.outputs.workflow_event }}
          EVIDENCE_ARTIFACT_ID: ${{ steps.windows-evidence.outputs.artifact_id }}
          EVIDENCE_ARTIFACT_NAME: ${{ steps.windows-evidence.outputs.artifact_name }}
          EVIDENCE_ARTIFACT_DIGEST: ${{ steps.windows-evidence.outputs.artifact_digest }}
          EVIDENCE_SOURCE_COMMIT: ${{ steps.windows-evidence.outputs.source_commit }}
          LINUX_ARTIFACT_ID: ${{ steps.windows-evidence.outputs.linux_artifact_id }}
          LINUX_ARTIFACT_NAME: ${{ steps.windows-evidence.outputs.linux_artifact_name }}
          LINUX_ARTIFACT_DIGEST: ${{ steps.windows-evidence.outputs.linux_artifact_digest }}
        run: |
          set -euo pipefail
          run_id="$EVIDENCE_RUN_ID"
          run_attempt="$EVIDENCE_RUN_ATTEMPT"
          workflow_id="$EVIDENCE_WORKFLOW_ID"
          workflow_path="$EVIDENCE_WORKFLOW_PATH"
          workflow_event="$EVIDENCE_WORKFLOW_EVENT"
          artifact_id="$EVIDENCE_ARTIFACT_ID"
          artifact_name="$EVIDENCE_ARTIFACT_NAME"
          artifact_digest="$EVIDENCE_ARTIFACT_DIGEST"
          source_commit="$EVIDENCE_SOURCE_COMMIT"
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
          jq -e \
            --argjson run_id "$run_id" \
            --argjson run_attempt "$run_attempt" \
            --argjson workflow_id "$workflow_id" \
            --arg workflow_path "$workflow_path" \
            --arg workflow_event "$workflow_event" \
            --arg source_commit "$source_commit" \
            '.id == $run_id and .run_attempt == $run_attempt and
             .workflow_id == $workflow_id and .path == $workflow_path and
             .event == $workflow_event and .head_sha == $source_commit and
             .conclusion == "success"' <<<"$run_json"
          workflow_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}")"
          jq -e \
            --argjson workflow_id "$workflow_id" \
            --arg workflow_path "$workflow_path" \
            '.id == $workflow_id and .path == $workflow_path' <<<"$workflow_json"
          artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}")"
          jq -e \
            --argjson artifact_id "$artifact_id" \
            --argjson run_id "$run_id" \
            --arg artifact_name "$artifact_name" \
            --arg artifact_digest "$artifact_digest" \
            --arg source_commit "$source_commit" \
            '.id == $artifact_id and .name == $artifact_name and .expired == false and
             .digest == $artifact_digest and .workflow_run.id == $run_id and
             .workflow_run.head_sha == $source_commit' <<<"$artifact_json"
          linux_artifact_id="$LINUX_ARTIFACT_ID"
          linux_artifact_name="$LINUX_ARTIFACT_NAME"
          linux_artifact_digest="$LINUX_ARTIFACT_DIGEST"
          linux_artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${linux_artifact_id}")"
          jq -e \
            --argjson artifact_id "$linux_artifact_id" \
            --argjson run_id "$run_id" \
            --arg artifact_name "$linux_artifact_name" \
            --arg artifact_digest "$linux_artifact_digest" \
            --arg source_commit "$source_commit" \
            '.id == $artifact_id and .name == $artifact_name and .expired == false and
             .digest == $artifact_digest and .workflow_run.id == $run_id and
             .workflow_run.head_sha == $source_commit' <<<"$linux_artifact_json"
      - name: Download exact verified Windows candidate artifact
        if: >-
          steps.target.outputs.publish == 'true' &&
          steps.windows-evidence.outputs.required == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.windows-evidence.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.windows-evidence.outputs.artifact_digest }}
          ARCHIVE_RELATIVE_PATH: ${{ steps.windows-evidence.outputs.archive_relative_path }}
          VERIFICATION_RELATIVE_PATH: ${{ steps.windows-evidence.outputs.verification_relative_path }}
        run: |
          set -euo pipefail
          artifact_zip="${RUNNER_TEMP}/topoforge-candidate-${ARTIFACT_ID}.zip"
          extraction_root="${RUNNER_TEMP}/topoforge-candidate-extracted-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$extraction_root" && test ! -L "$extraction_root"
          curl --fail-with-body --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output "$artifact_zip"
          test "sha256:$(sha256sum "$artifact_zip" | cut -d' ' -f1)" = \
            "$ARTIFACT_DIGEST"
          env -u GH_TOKEN python scripts/verify_release_evidence.py \
            --extract-artifact "$artifact_zip" \
            --extract-destination "$extraction_root" \
            --extract-member "$ARCHIVE_RELATIVE_PATH" \
            --extract-member "$VERIFICATION_RELATIVE_PATH" \
            --allow-extract-member SHA256SUMS \
            --allow-extract-member dist/windows-primary/SHA256SUMS \
            --allow-extract-member ci-windows-portable-primary-build.json \
            --allow-extract-member ci-windows-portable-repeat-build.json \
            --allow-extract-member artifacts/logs/ci-windows-portable-primary-build.json \
            --allow-extract-member artifacts/logs/ci-windows-portable-repeat-build.json
      - name: Verify independent clean Windows workflow identities
        if: >-
          steps.target.outputs.publish == 'true' &&
          steps.windows-evidence.outputs.required == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_SOURCE_COMMIT: ${{ steps.windows-evidence.outputs.source_commit }}
          WIN10_RUN_ID: ${{ steps.windows-evidence.outputs.win10_run_id }}
          WIN10_RUN_ATTEMPT: ${{ steps.windows-evidence.outputs.win10_run_attempt }}
          WIN10_WORKFLOW_ID: ${{ steps.windows-evidence.outputs.win10_workflow_id }}
          WIN10_WORKFLOW_PATH: ${{ steps.windows-evidence.outputs.win10_workflow_path }}
          WIN10_WORKFLOW_EVENT: ${{ steps.windows-evidence.outputs.win10_workflow_event }}
          WIN10_ARTIFACT_ID: ${{ steps.windows-evidence.outputs.win10_artifact_id }}
          WIN10_ARTIFACT_NAME: ${{ steps.windows-evidence.outputs.win10_artifact_name }}
          WIN10_ARTIFACT_DIGEST: ${{ steps.windows-evidence.outputs.win10_artifact_digest }}
          WIN11_RUN_ID: ${{ steps.windows-evidence.outputs.win11_run_id }}
          WIN11_RUN_ATTEMPT: ${{ steps.windows-evidence.outputs.win11_run_attempt }}
          WIN11_WORKFLOW_ID: ${{ steps.windows-evidence.outputs.win11_workflow_id }}
          WIN11_WORKFLOW_PATH: ${{ steps.windows-evidence.outputs.win11_workflow_path }}
          WIN11_WORKFLOW_EVENT: ${{ steps.windows-evidence.outputs.win11_workflow_event }}
          WIN11_ARTIFACT_ID: ${{ steps.windows-evidence.outputs.win11_artifact_id }}
          WIN11_ARTIFACT_NAME: ${{ steps.windows-evidence.outputs.win11_artifact_name }}
          WIN11_ARTIFACT_DIGEST: ${{ steps.windows-evidence.outputs.win11_artifact_digest }}
        run: |
          set -euo pipefail
          verify_clean_run() {
            local run_id="$1"
            local run_attempt="$2"
            local workflow_id="$3"
            local workflow_path="$4"
            local workflow_event="$5"
            local artifact_id="$6"
            local artifact_name="$7"
            local artifact_digest="$8"
            local source_commit="$EVIDENCE_SOURCE_COMMIT"
            local run_json workflow_json artifact_json
            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            jq -e \
              --argjson run_id "$run_id" \
              --argjson run_attempt "$run_attempt" \
              --argjson workflow_id "$workflow_id" \
              --arg workflow_path "$workflow_path" \
              --arg workflow_event "$workflow_event" \
              --arg source_commit "$source_commit" \
              '.id == $run_id and .run_attempt == $run_attempt and
               .workflow_id == $workflow_id and .path == $workflow_path and
               .event == $workflow_event and .head_sha == $source_commit and
               .conclusion == "success"' <<<"$run_json"
            workflow_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}")"
            jq -e \
              --argjson workflow_id "$workflow_id" \
              --arg workflow_path "$workflow_path" \
              '.id == $workflow_id and .path == $workflow_path' <<<"$workflow_json"
            artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}")"
            jq -e \
              --argjson artifact_id "$artifact_id" \
              --argjson run_id "$run_id" \
              --arg artifact_name "$artifact_name" \
              --arg artifact_digest "$artifact_digest" \
              --arg source_commit "$source_commit" \
              '.id == $artifact_id and .name == $artifact_name and .expired == false and
               .digest == $artifact_digest and .workflow_run.id == $run_id and
               .workflow_run.head_sha == $source_commit' <<<"$artifact_json"
          }
          verify_clean_run \
            "$WIN10_RUN_ID" \
            "$WIN10_RUN_ATTEMPT" \
            "$WIN10_WORKFLOW_ID" \
            "$WIN10_WORKFLOW_PATH" \
            "$WIN10_WORKFLOW_EVENT" \
            "$WIN10_ARTIFACT_ID" \
            "$WIN10_ARTIFACT_NAME" \
            "$WIN10_ARTIFACT_DIGEST"
          verify_clean_run \
            "$WIN11_RUN_ID" \
            "$WIN11_RUN_ATTEMPT" \
            "$WIN11_WORKFLOW_ID" \
            "$WIN11_WORKFLOW_PATH" \
            "$WIN11_WORKFLOW_EVENT" \
            "$WIN11_ARTIFACT_ID" \
            "$WIN11_ARTIFACT_NAME" \
            "$WIN11_ARTIFACT_DIGEST"
      - name: Download exact independent clean-system artifacts
        if: >-
          steps.target.outputs.publish == 'true' &&
          steps.windows-evidence.outputs.required == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WIN10_ARTIFACT_ID: ${{ steps.windows-evidence.outputs.win10_artifact_id }}
          WIN10_ARTIFACT_DIGEST: ${{ steps.windows-evidence.outputs.win10_artifact_digest }}
          WIN10_PRIVATE_PATH: ${{ steps.windows-evidence.outputs.win10_private_relative_path }}
          WIN10_PUBLIC_PATH: ${{ steps.windows-evidence.outputs.win10_public_relative_path }}
          WIN11_ARTIFACT_ID: ${{ steps.windows-evidence.outputs.win11_artifact_id }}
          WIN11_ARTIFACT_DIGEST: ${{ steps.windows-evidence.outputs.win11_artifact_digest }}
          WIN11_PRIVATE_PATH: ${{ steps.windows-evidence.outputs.win11_private_relative_path }}
          WIN11_PUBLIC_PATH: ${{ steps.windows-evidence.outputs.win11_public_relative_path }}
        run: |
          set -euo pipefail
          download_artifact() {
            local artifact_id="$1"
            local artifact_digest="$2"
            local private_relative="$3"
            local public_relative="$4"
            local artifact_zip="${RUNNER_TEMP}/topoforge-clean-${artifact_id}.zip"
            local extraction_root="${RUNNER_TEMP}/topoforge-clean-extracted-${artifact_id}"
            test ! -e "$extraction_root" && test ! -L "$extraction_root"
            curl --fail-with-body --location --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              --output "$artifact_zip"
            test "sha256:$(sha256sum "$artifact_zip" | cut -d' ' -f1)" = "$artifact_digest"
            env -u GH_TOKEN python scripts/verify_release_evidence.py \
              --extract-artifact "$artifact_zip" \
              --extract-destination "$extraction_root" \
              --extract-member "$private_relative" \
              --extract-member "$public_relative"
            test -f "${extraction_root}/${private_relative}"
            test -f "${extraction_root}/${public_relative}"
          }
          download_artifact \
            "$WIN10_ARTIFACT_ID" \
            "$WIN10_ARTIFACT_DIGEST" \
            "$WIN10_PRIVATE_PATH" \
            "$WIN10_PUBLIC_PATH"
          download_artifact \
            "$WIN11_ARTIFACT_ID" \
            "$WIN11_ARTIFACT_DIGEST" \
            "$WIN11_PRIVATE_PATH" \
            "$WIN11_PUBLIC_PATH"
      - name: Download exact canonical Linux core evidence
        if: >-
          steps.target.outputs.publish == 'true' &&
          steps.windows-evidence.outputs.required == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX_ARTIFACT_ID: ${{ steps.windows-evidence.outputs.linux_artifact_id }}
          LINUX_ARTIFACT_DIGEST: ${{ steps.windows-evidence.outputs.linux_artifact_digest }}
          LINUX_RELATIVE_PATH: ${{ steps.windows-evidence.outputs.linux_relative_path }}
        run: |
          set -euo pipefail
          artifact_zip="${RUNNER_TEMP}/topoforge-linux-${LINUX_ARTIFACT_ID}.zip"
          extraction_root="${RUNNER_TEMP}/topoforge-linux-extracted-${LINUX_ARTIFACT_ID}"
          test ! -e "$extraction_root" && test ! -L "$extraction_root"
          curl --fail-with-body --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${LINUX_ARTIFACT_ID}/zip" \
            --output "$artifact_zip"
          test "sha256:$(sha256sum "$artifact_zip" | cut -d' ' -f1)" = \
            "$LINUX_ARTIFACT_DIGEST"
          env -u GH_TOKEN python scripts/verify_release_evidence.py \
            --extract-artifact "$artifact_zip" \
            --extract-destination "$extraction_root" \
            --extract-member "$LINUX_RELATIVE_PATH"
          test -f "$extraction_root/$LINUX_RELATIVE_PATH"
      - name: Assemble exact downloaded release evidence
        if: >-
          steps.target.outputs.publish == 'true' &&
          steps.windows-evidence.outputs.required == 'true'
        shell: bash
        env:
          ARCHIVE_RELATIVE_PATH: ${{ steps.windows-evidence.outputs.archive_relative_path }}
          VERIFICATION_RELATIVE_PATH: ${{ steps.windows-evidence.outputs.verification_relative_path }}
          WIN10_ARTIFACT_ID: ${{ steps.windows-evidence.outputs.win10_artifact_id }}
          WIN10_PRIVATE_PATH: ${{ steps.windows-evidence.outputs.win10_private_relative_path }}
          WIN10_PUBLIC_PATH: ${{ steps.windows-evidence.outputs.win10_public_relative_path }}
          WIN11_ARTIFACT_ID: ${{ steps.windows-evidence.outputs.win11_artifact_id }}
          WIN11_PRIVATE_PATH: ${{ steps.windows-evidence.outputs.win11_private_relative_path }}
          WIN11_PUBLIC_PATH: ${{ steps.windows-evidence.outputs.win11_public_relative_path }}
          LINUX_ARTIFACT_ID: ${{ steps.windows-evidence.outputs.linux_artifact_id }}
          LINUX_RELATIVE_PATH: ${{ steps.windows-evidence.outputs.linux_relative_path }}
        run: |
          set -euo pipefail
          evidence_root="dist/windows-evidence"
          mkdir -p dist
          mkdir "$evidence_root"
          copy_exact_member() {
            local source_root="$1"
            local relative="$2"
            local source="${source_root}/${relative}"
            local destination="${evidence_root}/${relative}"
            test -f "$source" && test ! -L "$source"
            test "$(stat -c '%h' "$source")" = "1"
            mkdir -p "$(dirname -- "$destination")"
            test ! -e "$destination" && test ! -L "$destination"
            cp -- "$source" "$destination"
            test -f "$destination" && test ! -L "$destination"
            test "$(stat -c '%h' "$destination")" = "1"
            cmp --silent "$source" "$destination"
          }
          candidate_root="${RUNNER_TEMP}/topoforge-candidate-extracted-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          win10_root="${RUNNER_TEMP}/topoforge-clean-extracted-${WIN10_ARTIFACT_ID}"
          win11_root="${RUNNER_TEMP}/topoforge-clean-extracted-${WIN11_ARTIFACT_ID}"
          linux_root="${RUNNER_TEMP}/topoforge-linux-extracted-${LINUX_ARTIFACT_ID}"
          copy_exact_member \
            "$candidate_root" \
            "$ARCHIVE_RELATIVE_PATH"
          copy_exact_member \
            "$candidate_root" \
            "$VERIFICATION_RELATIVE_PATH"
          copy_exact_member \
            "$win10_root" \
            "$WIN10_PRIVATE_PATH"
          copy_exact_member \
            "$win10_root" \
            "$WIN10_PUBLIC_PATH"
          copy_exact_member \
            "$win11_root" \
            "$WIN11_PRIVATE_PATH"
          copy_exact_member \
            "$win11_root" \
            "$WIN11_PUBLIC_PATH"
          copy_exact_member \
            "$linux_root" \
            "$LINUX_RELATIVE_PATH"
      - name: Install locked build dependencies
        if: steps.target.outputs.publish == 'true'
        run: uv sync --locked --all-groups
      - name: Verify public source tree
        if: steps.target.outputs.publish == 'true'
        run: uv run python scripts/verify_public_tree.py
      - name: Build packaged Web application
        if: steps.target.outputs.publish == 'true'
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Verify packaged Web build matches release tag
        if: steps.target.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Build reproducible archives
        if: steps.target.outputs.publish == 'true'
        run: |
          uv build --no-sources --build-constraints packaging/build-constraints.txt --require-hashes --out-dir dist/primary
          uv build --no-sources --build-constraints packaging/build-constraints.txt --require-hashes --out-dir dist/repeat
      - id: archives
        name: Verify archives and isolated installation
        if: steps.target.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: >-
          uv run python scripts/verify_release.py
          --primary-dir dist/primary
          --repeat-dir dist/repeat
          --version "$RELEASE_VERSION"
          --install
          --github-output "$GITHUB_OUTPUT"
          --report artifacts/logs/github-release-verification.json
      - id: previous_release
        name: Download and verify exact previous public release artifacts
        if: >-
          steps.target.outputs.publish == 'true' &&
          steps.windows-evidence.outputs.required == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.windows-evidence.outputs.previous_release_tag }}
          PREVIOUS_RELEASE_ID: ${{ steps.windows-evidence.outputs.previous_release_id }}
          PREVIOUS_PUBLISHED_AT: ${{ steps.windows-evidence.outputs.previous_release_published_at }}
          PREVIOUS_WHEEL_FILENAME: ${{ steps.windows-evidence.outputs.previous_wheel_filename }}
          PREVIOUS_WHEEL_ASSET_ID: ${{ steps.windows-evidence.outputs.previous_wheel_asset_id }}
          PREVIOUS_WHEEL_SHA256: ${{ steps.windows-evidence.outputs.previous_wheel_sha256 }}
          PREVIOUS_CHECKSUMS_FILENAME: ${{ steps.windows-evidence.outputs.previous_checksums_filename }}
          PREVIOUS_CHECKSUMS_ASSET_ID: ${{ steps.windows-evidence.outputs.previous_checksums_asset_id }}
          PREVIOUS_CHECKSUMS_SHA256: ${{ steps.windows-evidence.outputs.previous_checksums_sha256 }}
        run: |
          set -euo pipefail
          previous_tag="$PREVIOUS_TAG"
          expected_release_id="$PREVIOUS_RELEASE_ID"
          expected_published_at="$PREVIOUS_PUBLISHED_AT"
          previous_wheel_filename="$PREVIOUS_WHEEL_FILENAME"
          expected_wheel_asset_id="$PREVIOUS_WHEEL_ASSET_ID"
          previous_wheel_sha256="$PREVIOUS_WHEEL_SHA256"
          previous_checksums_filename="$PREVIOUS_CHECKSUMS_FILENAME"
          expected_checksums_asset_id="$PREVIOUS_CHECKSUMS_ASSET_ID"
          previous_checksums_sha256="$PREVIOUS_CHECKSUMS_SHA256"
          previous_root="${RUNNER_TEMP}/topoforge-previous-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir "$previous_root"
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${previous_tag}")"
          observed_release_id="$(jq -er '.id' <<<"$release_json")"
          observed_published_at="$(jq -er '.published_at' <<<"$release_json")"
          jq -e \
            --arg previous_tag "$previous_tag" \
            --argjson expected_release_id "$expected_release_id" \
            --arg expected_published_at "$expected_published_at" \
            '.id == $expected_release_id and .tag_name == $previous_tag and
             .draft == false and .prerelease == false and
             .published_at == $expected_published_at' <<<"$release_json"
          previous_wheel_asset_id="$(jq -er \
            --arg filename "$previous_wheel_filename" \
            '[.assets[] | select(.name == $filename and .state == "uploaded")] |
             if length == 1 then .[0].id else error("expected exactly one previous wheel asset") end' \
            <<<"$release_json")"
          previous_checksums_asset_id="$(jq -er \
            --arg filename "$previous_checksums_filename" \
            '[.assets[] | select(.name == $filename and .state == "uploaded")] |
             if length == 1 then .[0].id else error("expected exactly one checksum asset") end' \
            <<<"$release_json")"
          test "$observed_release_id" = "$expected_release_id"
          test "$observed_published_at" = "$expected_published_at"
          test "$previous_wheel_asset_id" = "$expected_wheel_asset_id"
          test "$previous_checksums_asset_id" = "$expected_checksums_asset_id"
          download_release_asset() {
            local asset_id="$1"
            local output_path="$2"
            curl --fail-with-body --location --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              --output "$output_path"
          }
          previous_wheel_path="${previous_root}/${previous_wheel_filename}"
          previous_checksums_path="${previous_root}/${previous_checksums_filename}"
          download_release_asset "$previous_wheel_asset_id" "$previous_wheel_path"
          download_release_asset "$previous_checksums_asset_id" "$previous_checksums_path"
          test -f "$previous_wheel_path" && test ! -L "$previous_wheel_path"
          test -f "$previous_checksums_path" && test ! -L "$previous_checksums_path"
          test "$(sha256sum "$previous_wheel_path" | cut -d' ' -f1)" = "$previous_wheel_sha256"
          test "$(sha256sum "$previous_checksums_path" | cut -d' ' -f1)" = \
            "$previous_checksums_sha256"
          expected_checksum_line="${previous_wheel_sha256}  ${previous_wheel_filename}"
          test "$(grep -Fxc -- "$expected_checksum_line" "$previous_checksums_path")" -eq 1
          {
            echo "release_id=$observed_release_id"
            echo "published_at=$observed_published_at"
            echo "wheel_asset_id=$previous_wheel_asset_id"
            echo "checksums_asset_id=$previous_checksums_asset_id"
          } >> "$GITHUB_OUTPUT"
      - name: Generate executed rollback runtime evidence
        if: >-
          steps.target.outputs.publish == 'true' &&
          steps.windows-evidence.outputs.required == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          SOURCE_COMMIT: ${{ steps.windows-evidence.outputs.source_commit }}
          CURRENT_WHEEL_FILENAME: ${{ steps.windows-evidence.outputs.current_wheel_filename }}
          CURRENT_WHEEL_SHA256: ${{ steps.windows-evidence.outputs.current_wheel_sha256 }}
          PREVIOUS_WHEEL_FILENAME: ${{ steps.windows-evidence.outputs.previous_wheel_filename }}
          PREVIOUS_WHEEL_SHA256: ${{ steps.windows-evidence.outputs.previous_wheel_sha256 }}
          PREVIOUS_CHECKSUMS_FILENAME: ${{ steps.windows-evidence.outputs.previous_checksums_filename }}
          PREVIOUS_CHECKSUMS_SHA256: ${{ steps.windows-evidence.outputs.previous_checksums_sha256 }}
          PREVIOUS_RELEASE_ID: ${{ steps.previous_release.outputs.release_id }}
          PREVIOUS_PUBLISHED_AT: ${{ steps.previous_release.outputs.published_at }}
          PREVIOUS_WHEEL_ASSET_ID: ${{ steps.previous_release.outputs.wheel_asset_id }}
          PREVIOUS_CHECKSUMS_ASSET_ID: ${{ steps.previous_release.outputs.checksums_asset_id }}
          ROLLBACK_RUNTIME_PATH: ${{ steps.windows-evidence.outputs.rollback_runtime_relative_path }}
        run: |
          set -euo pipefail
          current_wheel="dist/primary/${CURRENT_WHEEL_FILENAME}"
          previous_root="${RUNNER_TEMP}/topoforge-previous-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test -f "$current_wheel" && test ! -L "$current_wheel"
          test "$(sha256sum "$current_wheel" | cut -d' ' -f1)" = \
            "$CURRENT_WHEEL_SHA256"
          uv run python scripts/verify_release_rollback.py \
            --version "$RELEASE_VERSION" \
            --source-commit "$SOURCE_COMMIT" \
            --script "scripts/rollback-topoforge-${RELEASE_VERSION}.sh" \
            --current-wheel "$current_wheel" \
            --current-wheel-sha256 "$CURRENT_WHEEL_SHA256" \
            --previous-wheel "${previous_root}/${PREVIOUS_WHEEL_FILENAME}" \
            --previous-wheel-sha256 "$PREVIOUS_WHEEL_SHA256" \
            --previous-checksums "${previous_root}/${PREVIOUS_CHECKSUMS_FILENAME}" \
            --previous-checksums-sha256 "$PREVIOUS_CHECKSUMS_SHA256" \
            --previous-release-id "$PREVIOUS_RELEASE_ID" \
            --previous-release-published-at "$PREVIOUS_PUBLISHED_AT" \
            --previous-wheel-asset-id "$PREVIOUS_WHEEL_ASSET_ID" \
            --previous-checksums-asset-id "$PREVIOUS_CHECKSUMS_ASSET_ID" \
            --retained-evidence-root "release-evidence/${RELEASE_VERSION}" \
            --work-root "${RUNNER_TEMP}/topoforge-rollback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --report "dist/windows-evidence/${ROLLBACK_RUNTIME_PATH}"
      - name: Verify exact Windows archive and clean-system reports
        if: >-
          steps.target.outputs.publish == 'true' &&
          steps.windows-evidence.outputs.required == 'true'
        env:
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: >-
          uv run python scripts/verify_release_evidence.py
          --version "$RELEASE_VERSION"
          --tag "$RELEASE_TAG"
          --artifact-root dist/windows-evidence
          --report artifacts/logs/github-windows-release-evidence.json
      - name: Stage verified Windows portable archive
        if: >-
          steps.target.outputs.publish == 'true' &&
          steps.windows-evidence.outputs.required == 'true'
        shell: bash
        env:
          ARCHIVE_FILENAME: ${{ steps.windows-evidence.outputs.archive_filename }}
          ARCHIVE_SHA256: ${{ steps.windows-evidence.outputs.archive_sha256 }}
          ARCHIVE_RELATIVE_PATH: ${{ steps.windows-evidence.outputs.archive_relative_path }}
        run: |
          set -euo pipefail
          archive_filename="$ARCHIVE_FILENAME"
          archive_sha256="$ARCHIVE_SHA256"
          archive_source="dist/windows-evidence/${ARCHIVE_RELATIVE_PATH}"
          archive_destination="dist/windows-release/${archive_filename}"
          test "$(basename -- "$archive_source")" = "$archive_filename"
          test -f "$archive_source" && test ! -L "$archive_source"
          test "$(stat -c '%h' "$archive_source")" = "1"
          test "$(sha256sum "$archive_source" | cut -d' ' -f1)" = "$archive_sha256"
          mkdir dist/windows-release
          cp -- "$archive_source" "$archive_destination"
          test -f "$archive_destination" && test ! -L "$archive_destination"
          test "$(stat -c '%h' "$archive_destination")" = "1"
          test "$(sha256sum "$archive_destination" | cut -d' ' -f1)" = "$archive_sha256"
      - id: release-assets
        name: Stage release assets and checksums
        if: steps.target.outputs.publish == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          WHEEL_FILENAME: ${{ steps.archives.outputs.wheel_filename }}
          WHEEL_SHA256: ${{ steps.archives.outputs.wheel_sha256 }}
          SDIST_FILENAME: ${{ steps.archives.outputs.sdist_filename }}
          SDIST_SHA256: ${{ steps.archives.outputs.sdist_sha256 }}
          WINDOWS_REQUIRED: ${{ steps.windows-evidence.outputs.required }}
          EVIDENCE_WHEEL_FILENAME: ${{ steps.windows-evidence.outputs.current_wheel_filename }}
          EVIDENCE_WHEEL_SHA256: ${{ steps.windows-evidence.outputs.current_wheel_sha256 }}
          PORTABLE_FILENAME: ${{ steps.windows-evidence.outputs.archive_filename }}
          PORTABLE_SHA256: ${{ steps.windows-evidence.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          mkdir dist/release
          version="$RELEASE_VERSION"
          current_wheel_filename="$WHEEL_FILENAME"
          current_wheel_sha256="$WHEEL_SHA256"
          current_sdist_filename="$SDIST_FILENAME"
          current_sdist_sha256="$SDIST_SHA256"
          release_verification_filename="topoforge-${version}-release-verification.json"
          release_verification_source="artifacts/logs/github-release-verification.json"
          test "$current_wheel_filename" = "topoforge-${version}-py3-none-any.whl"
          test "$current_sdist_filename" = "topoforge-${version}.tar.gz"
          current_wheel="dist/primary/${current_wheel_filename}"
          current_sdist="dist/primary/${current_sdist_filename}"
          for source in "$current_wheel" "$current_sdist" "$release_verification_source"; do
            test -f "$source" && test ! -L "$source"
            test "$(stat -c '%h' "$source")" = "1"
          done
          if [[ "$WINDOWS_REQUIRED" != "true" && "$WINDOWS_REQUIRED" != "false" ]]; then
            echo "invalid Windows evidence requirement output" >&2
            exit 1
          fi
          if [[ "$WINDOWS_REQUIRED" == "true" ]]; then
            test "$current_wheel_filename" = \
              "$EVIDENCE_WHEEL_FILENAME"
            test "$current_wheel_sha256" = \
              "$EVIDENCE_WHEEL_SHA256"
          fi
          test "$(sha256sum "$current_wheel" | cut -d' ' -f1)" = "$current_wheel_sha256"
          test "$(sha256sum "$current_sdist" | cut -d' ' -f1)" = "$current_sdist_sha256"
          cp -- "$current_wheel" "dist/release/${current_wheel_filename}"
          cp -- "$current_sdist" "dist/release/${current_sdist_filename}"
          cp -- "$release_verification_source" \
            "dist/release/${release_verification_filename}"
          staged_current_wheel="dist/release/${current_wheel_filename}"
          staged_current_sdist="dist/release/${current_sdist_filename}"
          test "$(sha256sum "$staged_current_wheel" | cut -d' ' -f1)" = "$current_wheel_sha256"
          test "$(sha256sum "$staged_current_sdist" | cut -d' ' -f1)" = "$current_sdist_sha256"
          asset_filenames=(
            "$current_wheel_filename"
            "$current_sdist_filename"
            "$release_verification_filename"
          )
          if [[ "$WINDOWS_REQUIRED" == "true" ]]; then
            portable_archive_filename="$PORTABLE_FILENAME"
            portable_archive_sha256="$PORTABLE_SHA256"
            portable_archive_source="dist/windows-release/${portable_archive_filename}"
            windows_evidence_filename="topoforge-${version}-windows-release-evidence.json"
            windows_evidence_source="artifacts/logs/github-windows-release-evidence.json"
            test "$portable_archive_filename" = \
              "topoforge-${version}-windows-x64-portable.zip"
            for source in "$portable_archive_source" "$windows_evidence_source"; do
              test -f "$source" && test ! -L "$source"
              test "$(stat -c '%h' "$source")" = "1"
            done
            test "$(sha256sum "$portable_archive_source" | cut -d' ' -f1)" = \
              "$portable_archive_sha256"
            cp -- "$portable_archive_source" \
              "dist/release/${portable_archive_filename}"
            cp -- "$windows_evidence_source" \
              "dist/release/${windows_evidence_filename}"
            test "$(sha256sum "dist/release/${portable_archive_filename}" | cut -d' ' -f1)" = \
              "$portable_archive_sha256"
            asset_filenames+=("$portable_archive_filename" "$windows_evidence_filename")
          fi
          cd dist/release
          sha256sum -- "${asset_filenames[@]}" > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          checksums_sha256="$(sha256sum SHA256SUMS | cut -d' ' -f1)"
          echo "checksums_sha256=${checksums_sha256}" >> "$GITHUB_OUTPUT"
      - name: Retain immutable publication bundle
        if: steps.target.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: topoforge-publication-bundle
          path: dist/release
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    name: Publish verified release assets
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download immutable publication bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: topoforge-publication-bundle
          path: dist/release
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
          WHEEL_FILENAME: ${{ needs.prepare.outputs.wheel_filename }}
          WHEEL_SHA256: ${{ needs.prepare.outputs.wheel_sha256 }}
          SDIST_FILENAME: ${{ needs.prepare.outputs.sdist_filename }}
          SDIST_SHA256: ${{ needs.prepare.outputs.sdist_sha256 }}
          WINDOWS_REQUIRED: ${{ needs.prepare.outputs.windows_required }}
          PORTABLE_FILENAME: ${{ needs.prepare.outputs.portable_filename }}
          PORTABLE_SHA256: ${{ needs.prepare.outputs.portable_sha256 }}
          CHECKSUMS_SHA256: ${{ needs.prepare.outputs.checksums_sha256 }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          release_root="dist/release"
          current_wheel_filename="$WHEEL_FILENAME"
          current_wheel_sha256="$WHEEL_SHA256"
          current_sdist_filename="$SDIST_FILENAME"
          current_sdist_sha256="$SDIST_SHA256"
          [[ "$version" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]
          test "$RELEASE_TAG" = "v${version}"
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$current_wheel_filename" = "topoforge-${version}-py3-none-any.whl"
          test "$current_sdist_filename" = "topoforge-${version}.tar.gz"
          [[ "$current_wheel_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$current_sdist_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CHECKSUMS_SHA256" =~ ^[0-9a-f]{64}$ ]]
          if [[ "$WINDOWS_REQUIRED" != "true" && "$WINDOWS_REQUIRED" != "false" ]]; then
            echo "invalid Windows evidence requirement output" >&2
            exit 1
          fi
          release_verification_filename="topoforge-${version}-release-verification.json"
          asset_filenames=(
            "$current_wheel_filename"
            "$current_sdist_filename"
            "$release_verification_filename"
          )
          if [[ "$WINDOWS_REQUIRED" == "true" ]]; then
            portable_archive_filename="$PORTABLE_FILENAME"
            portable_archive_sha256="$PORTABLE_SHA256"
            test "$portable_archive_filename" = \
              "topoforge-${version}-windows-x64-portable.zip"
            [[ "$portable_archive_sha256" =~ ^[0-9a-f]{64}$ ]]
            windows_evidence_filename="topoforge-${version}-windows-release-evidence.json"
            asset_filenames+=("$portable_archive_filename" "$windows_evidence_filename")
          fi

          checksums_path="${release_root}/SHA256SUMS"
          test -f "$checksums_path" && test ! -L "$checksums_path"
          test "$(stat -c '%h' "$checksums_path")" = "1"
          test "$(sha256sum "$checksums_path" | cut -d' ' -f1)" = \
            "$CHECKSUMS_SHA256"
          for filename in "${asset_filenames[@]}"; do
            asset_path="${release_root}/${filename}"
            test -f "$asset_path" && test ! -L "$asset_path"
            test "$(stat -c '%h' "$asset_path")" = "1"
          done
          test "$(sha256sum "${release_root}/${current_wheel_filename}" | cut -d' ' -f1)" = \
            "$current_wheel_sha256"
          test "$(sha256sum "${release_root}/${current_sdist_filename}" | cut -d' ' -f1)" = \
            "$current_sdist_sha256"
          if [[ "$WINDOWS_REQUIRED" == "true" ]]; then
            test "$(sha256sum "${release_root}/${portable_archive_filename}" | cut -d' ' -f1)" = \
              "$portable_archive_sha256"
          fi

          expected_inventory="$(mktemp "${RUNNER_TEMP}/topoforge-release-expected.XXXXXX")"
          observed_inventory="$(mktemp "${RUNNER_TEMP}/topoforge-release-observed.XXXXXX")"
          expected_checksums="$(mktemp "${RUNNER_TEMP}/topoforge-release-checksums.XXXXXX")"
          printf '%s\0' SHA256SUMS "${asset_filenames[@]}" | LC_ALL=C sort -z > "$expected_inventory"
          find "$release_root" -mindepth 1 -maxdepth 1 -printf '%f\0' | \
            LC_ALL=C sort -z > "$observed_inventory"
          cmp --silent "$expected_inventory" "$observed_inventory"

          cd "$release_root"
          sha256sum -- "${asset_filenames[@]}" > "$expected_checksums"
          cmp --silent SHA256SUMS "$expected_checksums"
          sha256sum --check --strict SHA256SUMS

          resolve_release_tag_commit() {
            local ref_json object_type object_sha tag_json depth
            declare -A seen_tag_objects=()
            ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"
            object_type="$(jq -er '.object.type' <<<"$ref_json")"
            object_sha="$(jq -er '.object.sha' <<<"$ref_json")"
            depth=0
            while [[ "$object_type" == "tag" ]]; do
              [[ "$object_sha" =~ ^[0-9a-f]{40}$ ]]
              if [[ -n "${seen_tag_objects[$object_sha]:-}" ]]; then
                echo "annotated release tag chain contains a cycle" >&2
                return 1
              fi
              seen_tag_objects[$object_sha]=1
              depth=$((depth + 1))
              if (( depth > 16 )); then
                echo "annotated release tag chain exceeds the depth bound" >&2
                return 1
              fi
              tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")"
              object_type="$(jq -er '.object.type' <<<"$tag_json")"
              object_sha="$(jq -er '.object.sha' <<<"$tag_json")"
            done
            test "$object_type" = "commit"
            [[ "$object_sha" =~ ^[0-9a-f]{40}$ ]]
            printf '%s\n' "$object_sha"
          }
          resolved_source_commit="$(resolve_release_tag_commit)"
          test "$resolved_source_commit" = "$SOURCE_COMMIT"
          gh release create "$RELEASE_TAG" \
            "${asset_filenames[@]}" SHA256SUMS \
            --verify-tag \
            --title "TopoForge ${version}" \
            --generate-notes
